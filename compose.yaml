services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        HTTP_PROXY: "${HTTP_PROXY:-}"
        HTTPS_PROXY: "${HTTPS_PROXY:-}"
        NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1}"

    restart: unless-stopped
    init: true

    ports:
      - "${PORT:-3000}:${PORT:-3000}"

    environment:
      NODE_ENV: "${NODE_ENV:-production}"
      PORT: "${PORT:-3000}"
      AUTH_SECRET: "${AUTH_SECRET:?Set AUTH_SECRET in .env}"
      TZ: "${TZ:-Asia/Jakarta}"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || '3000') + '/', { signal: AbortSignal.timeout(4000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
